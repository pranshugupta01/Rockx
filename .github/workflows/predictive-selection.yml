name: Predictive Test Selection

on:
  pull_request:
    branches: [main]

jobs:
  predictive-selection:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-study
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get changed files
        id: changed
        run: |
          # git diff always returns repo-root-relative paths, even when cwd is
          # this subfolder (verified — do not assume otherwise) — so scope the
          # pathspec to the repo-root-relative prefix, then strip that prefix
          # to get paths relative to this subfolder, which is what the
          # static-impact-analysis script (run with absRoot=.) expects.
          FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- src tests | sed 's#^playwright-study/##')
          echo "$FILES"
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Tier 1 — deterministic static import-graph selection. Always runs,
      # costs nothing, never depends on any external service.
      - name: Tier 1 — static impact analysis
        run: |
          node ../.github/predictive-testing/scripts/static-impact-analysis.mjs . \
            ${{ steps.changed.outputs.files }} \
            > /tmp/tier1.json
          cat /tmp/tier1.json

      # Tier 2 — targeted blast-radius check via a plain OpenAI-compatible chat
      # completion (TrueFoundry's LLM gateway). No agent framework, no MCP, no
      # sandbox — reads files already checked out locally. Never fails the
      # job — Tier 1's result stands alone if this is unavailable.
      - name: Tier 2 — agentic blast-radius check
        env:
          TRUEFOUNDRY_MODEL_ID: ${{ secrets.TRUEFOUNDRY_MODEL_ID }}
          TRUEFOUNDRY_MODEL_BASE_URL: ${{ secrets.TRUEFOUNDRY_MODEL_BASE_URL }}
          TRUEFOUNDRY_MODEL_API_KEY: ${{ secrets.TRUEFOUNDRY_MODEL_API_KEY }}
        run: |
          npm i --no-save openai
          node ../.github/predictive-testing/scripts/agentic-blast-radius.mjs \
            . \
            ${{ steps.changed.outputs.files }} \
            > /tmp/tier2.json
          cat /tmp/tier2.json

      - name: Merge Tier 1 + Tier 2 selection
        run: |
          node ../.github/predictive-testing/scripts/merge-selection.mjs /tmp/tier1.json /tmp/tier2.json > /tmp/selected.json
          echo "Selected specs:"
          cat /tmp/selected.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Serve app under test
        run: |
          npx serve -c ./serve.json -s ./sample-app-web -l 3000 &
          npx wait-on http://localhost:3000

      - name: Run selected tests
        run: |
          SELECTED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/selected.json','utf8')).join(' '))")
          if [ -z "$SELECTED" ]; then
            echo "No specs affected by this PR's changes — nothing to run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "## Predictive Test Selection" >> "$GITHUB_STEP_SUMMARY"
          echo "Running: $SELECTED" >> "$GITHUB_STEP_SUMMARY"
          npx playwright test --project 'chromium-hd' $SELECTED
