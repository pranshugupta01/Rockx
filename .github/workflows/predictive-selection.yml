name: Predictive Test Selection

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_url:
        description: "PR URL to test, e.g. https://github.com/owner/repo/pull/123"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  predictive-selection:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-study
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # workflow_dispatch has no `github.event.pull_request.*` context — resolve
      # the PR's number and both SHAs from the input URL via gh CLI instead, so
      # every step below can use the same steps.pr.outputs.* regardless of
      # which trigger fired.
      - name: Resolve PR info
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_URL="${{ inputs.pr_url }}"
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            if [ -z "$PR_NUMBER" ]; then
              echo "Could not extract a PR number from: $PR_URL" >&2
              exit 1
            fi
            PR_JSON=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json baseRefOid,headRefOid,headRefName)
            BASE_SHA=$(echo "$PR_JSON" | jq -r '.baseRefOid')
            HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
            HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')
          else
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            HEAD_REF="${{ github.event.pull_request.head.ref }}"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      # For workflow_dispatch, the initial checkout above is on the default
      # branch — explicitly move to the PR's actual head commit so the rest of
      # the pipeline runs against the PR's real code, not against main.
      - name: Checkout PR head (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd ..
          git fetch origin "${{ steps.pr.outputs.head_sha }}"
          git checkout "${{ steps.pr.outputs.head_sha }}"

      # Whatever got checked out above (the pull_request merge-ref, which can
      # be stale, or the PR's raw head commit for workflow_dispatch) may not
      # contain the pipeline's own scripts under .github/ — force them to
      # always come from main's current tip, unconditionally, right before
      # they're used. Also the right security posture: a PR shouldn't be able
      # to alter the CI logic that tests it.
      - name: Ensure predictive-testing scripts are from main
        run: |
          cd ..
          git fetch origin main
          git checkout origin/main -- .github

      - name: Get changed files
        id: changed
        run: |
          # git diff always returns repo-root-relative paths, even when cwd is
          # this subfolder (verified — do not assume otherwise) — so scope the
          # pathspec to the repo-root-relative prefix, then strip that prefix
          # to get paths relative to this subfolder, which is what the
          # static-impact-analysis script (run with absRoot=.) expects.
          # IMPORTANT: this must end up SPACE-separated on ONE line. Every
          # downstream step interpolates steps.changed.outputs.files inline
          # into a multi-line bash script via GitHub Actions' own expression
          # substitution, which happens BEFORE bash ever parses the script —
          # a newline-separated value here silently splits one intended
          # command into several separate shell statements downstream (this
          # broke in CI: bash tried to *execute* a file path as a command and
          # failed with "Permission denied"). Space-separated + single-line
          # avoids that whole class of bug entirely, no heredoc needed.
          FILES=$(git diff --name-only "${{ steps.pr.outputs.base_sha }}" "${{ steps.pr.outputs.head_sha }}" -- src tests sample-app-web | sed 's#^playwright-study/##' | tr '\n' ' ')
          echo "$FILES"
          # Write the file list to a real file (not a heredoc step-output) so
          # the next step can pass it as a single argv element. Bash on the
          # previous run split the heredoc-expanded multi-line text into
          # separate commands and tried to "execute" each filename (exit 126:
          # Permission denied on a .js file because it isn't +x).
          echo "$FILES" > /tmp/changed-files.txt
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "files_path=/tmp/changed-files.txt" >> "$GITHUB_OUTPUT"

      # Agentic blast-radius check via a plain OpenAI-compatible chat
      # completion (TrueFoundry's LLM gateway). Reads files already checked
      # out locally — no agent framework, no MCP, no sandbox. Missing any of
      # the three required env vars = graceful no-op (writes []), the runner
      # step below then runs the full suite as a safe default.
      - name: Agentic test selection
        env:
          # Right-hand side must match the actual GitHub secret names
          # (TRUEFORGE_MODEL_*, confirmed from the repo's Settings > Secrets
          # page) — left-hand side is just this step's own env var name,
          # passed through unchanged to agentic-blast-radius.mjs.
          TRUEFOUNDRY_MODEL_ID: ${{ secrets.TRUEFORGE_MODEL_ID }}
          TRUEFOUNDRY_MODEL_BASE_URL: ${{ secrets.TRUEFORGE_MODEL_BASE_URL }}
          TRUEFOUNDRY_MODEL_API_KEY: ${{ secrets.TRUEFORGE_MODEL_API_KEY }}
        run: |
          # Read file list from disk (one path per line) instead of inlining
          # the heredoc step-output — the heredoc preserves embedded newlines
          # that bash then interprets as command separators, which is what
          # produced the previous "Permission denied" exit 126.
          if [ ! -s /tmp/changed-files.txt ] || ! grep -q '[^[:space:]]' /tmp/changed-files.txt; then
            echo "No src/tests/sample-app-web files changed — nothing to select."
            echo '[]' > /tmp/selected.json
          else
            # Install openai without modifying package.json (the LLM client
            # is needed only at runtime; the project's own deps stay clean).
            # --no-save + --silent + explicit cache buster so a stale npm
            # cache from a prior interrupted run never wedges this step.
            npm install --no-save --no-audit --no-fund --silent openai@latest
            # Pass changed files as xargs argv from disk — never inline the
            # heredoc output (which carries embedded newlines that bash
            # would otherwise split into separate "commands").
            node ../.github/predictive-testing/scripts/agentic-blast-radius.mjs \
              . \
              $(cat /tmp/changed-files.txt) \
              > /tmp/selected.json || echo '[]' > /tmp/selected.json
          fi
          echo "Selected specs:"
          cat /tmp/selected.json

      - name: Install dependencies
        # --ignore-scripts skips the `husky install` prepare hook: husky 8.x
        # doesn't honor HUSKY_GIT_DIR (only newer versions do) and the .git
        # directory lives at the repo root, one level above cwd. Husky is
        # irrelevant to a CI test runner anyway.
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Serve app under test
        run: |
          npx serve -c ./serve.json -s ./sample-app-web -l 3000 &
          npx wait-on http://localhost:3000

      - name: Run selected tests
        run: |
          SELECTED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/selected.json','utf8')).join(' '))")
          if [ -z "$SELECTED" ]; then
            echo "No specs affected by this PR's changes — falling back to running the full suite." >> "$GITHUB_STEP_SUMMARY"
            SELECTED=""
          fi
          echo "## Predictive Test Selection" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$SELECTED" ]; then
            echo "No specs selected — running the full Playwright suite." >> "$GITHUB_STEP_SUMMARY"
            npx playwright test --project 'chromium-hd'
          else
            echo "Running: $SELECTED" >> "$GITHUB_STEP_SUMMARY"
            npx playwright test --project 'chromium-hd' $SELECTED
          fi
