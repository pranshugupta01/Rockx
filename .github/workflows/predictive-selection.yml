name: Predictive Test Selection

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_url:
        description: "PR URL to test, e.g. https://github.com/owner/repo/pull/123"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  predictive-selection:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-study
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # workflow_dispatch has no `github.event.pull_request.*` context — resolve
      # the PR's number and both SHAs from the input URL via gh CLI instead, so
      # every step below can use the same steps.pr.outputs.* regardless of
      # which trigger fired.
      - name: Resolve PR info
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_URL="${{ inputs.pr_url }}"
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            if [ -z "$PR_NUMBER" ]; then
              echo "Could not extract a PR number from: $PR_URL" >&2
              exit 1
            fi
            PR_JSON=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json baseRefOid,headRefOid,headRefName)
            BASE_SHA=$(echo "$PR_JSON" | jq -r '.baseRefOid')
            HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
            HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')
          else
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            HEAD_REF="${{ github.event.pull_request.head.ref }}"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      # For workflow_dispatch, the initial checkout above is on the default
      # branch — explicitly move to the PR's actual head commit so the rest of
      # the pipeline runs against the PR's real code, not against main.
      - name: Checkout PR head (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd ..
          git fetch origin "${{ steps.pr.outputs.head_sha }}"
          git checkout "${{ steps.pr.outputs.head_sha }}"

      - name: Get changed files
        id: changed
        run: |
          # git diff always returns repo-root-relative paths, even when cwd is
          # this subfolder (verified — do not assume otherwise) — so scope the
          # pathspec to the repo-root-relative prefix, then strip that prefix
          # to get paths relative to this subfolder, which is what the
          # static-impact-analysis script (run with absRoot=.) expects.
          FILES=$(git diff --name-only "${{ steps.pr.outputs.base_sha }}" "${{ steps.pr.outputs.head_sha }}" -- src tests | sed 's#^playwright-study/##')
          echo "$FILES"
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Tier 1 — deterministic static import-graph selection. Always runs,
      # costs nothing, never depends on any external service.
      - name: Tier 1 — static impact analysis
        run: |
          if [ -z "$(echo '${{ steps.changed.outputs.files }}' | tr -d '[:space:]')" ]; then
            echo "No src/tests files changed — Tier 1: writing [] and skipping."
            echo '[]' > /tmp/tier1.json
          else
            node ../.github/predictive-testing/scripts/static-impact-analysis.mjs . \
              ${{ steps.changed.outputs.files }} \
              > /tmp/tier1.json
          fi
          cat /tmp/tier1.json

      # Tier 2 — targeted blast-radius check via a plain OpenAI-compatible chat
      # completion (TrueFoundry's LLM gateway). No agent framework, no MCP, no
      # sandbox — reads files already checked out locally. Never fails the
      # job — Tier 1's result stands alone if this is unavailable.
      - name: Tier 2 — agentic blast-radius check
        env:
          TRUEFOUNDRY_MODEL_ID: ${{ secrets.TRUEFOUNDRY_MODEL_ID }}
          TRUEFOUNDRY_MODEL_BASE_URL: ${{ secrets.TRUEFOUNDRY_MODEL_BASE_URL }}
          TRUEFOUNDRY_MODEL_API_KEY: ${{ secrets.TRUEFOUNDRY_MODEL_API_KEY }}
        run: |
          if [ -z "$(echo '${{ steps.changed.outputs.files }}' | tr -d '[:space:]')" ]; then
            echo "No src/tests files changed — Tier 2: writing [] and skipping."
            echo '[]' > /tmp/tier2.json
          else
            npm i --no-save openai
            node ../.github/predictive-testing/scripts/agentic-blast-radius.mjs \
              . \
              ${{ steps.changed.outputs.files }} \
              > /tmp/tier2.json
          fi
          cat /tmp/tier2.json

      - name: Merge Tier 1 + Tier 2 selection
        run: |
          node ../.github/predictive-testing/scripts/merge-selection.mjs /tmp/tier1.json /tmp/tier2.json > /tmp/selected.json
          echo "Selected specs:"
          cat /tmp/selected.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Serve app under test
        run: |
          npx serve -c ./serve.json -s ./sample-app-web -l 3000 &
          npx wait-on http://localhost:3000

      - name: Run selected tests
        run: |
          SELECTED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/selected.json','utf8')).join(' '))")
          if [ -z "$SELECTED" ]; then
            echo "No specs affected by this PR's changes — nothing to run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "## Predictive Test Selection" >> "$GITHUB_STEP_SUMMARY"
          echo "Running: $SELECTED" >> "$GITHUB_STEP_SUMMARY"
          npx playwright test --project 'chromium-hd' $SELECTED
